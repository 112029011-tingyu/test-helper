<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-label="地方性斑疹傷寒傳播途徑示意圖" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d5a6c"/></marker></defs>
<rect width="900" height="480" fill="#f3f0e8"/>
<rect x="30" y="70" width="190" height="64" rx="6" fill="#ead3cf" fill-opacity="1" stroke="#3d5a6c" stroke-width="1.2"/>
<text x="125.0" y="96.6" text-anchor="middle" font-size="16" fill="#2e2e2b">屋頂鼠、溝鼠</text>
<text x="125.0" y="118.6" text-anchor="middle" font-size="13" fill="#2e2e2b">囓齒類宿主</text>
<rect x="340" y="40" width="250" height="120" rx="6" fill="#f3f0e8" fill-opacity="1" stroke="#3d5a6c" stroke-width="1.2"/>
<text x="465.0" y="73.75" text-anchor="middle" font-size="15" fill="#2e2e2b">鼠蚤 (Xenopsylla cheopis)</text>
<text x="465.0" y="94.75" text-anchor="middle" font-size="12" fill="#2e2e2b">雌雄皆可吸血</text>
<text x="465.0" y="115.75" text-anchor="middle" font-size="12" fill="#2e2e2b">吸血後約 10–12 天具傳染性</text>
<text x="465.0" y="136.75" text-anchor="middle" font-size="12" fill="#2e2e2b">終生帶立克次體</text>
<rect x="700" y="40" width="170" height="130" rx="6" fill="#f3f0e8" fill-opacity="1" stroke="#3d5a6c" stroke-width="1.2"/>
<text x="785.0" y="76.45" text-anchor="middle" font-size="17" fill="#2e2e2b">人</text>
<text x="785.0" y="99.45" text-anchor="middle" font-size="14" fill="#2e2e2b">潛伏期 1–2 週</text>
<text x="785.0" y="122.45" text-anchor="middle" font-size="14" fill="#2e2e2b">通常 12 天</text>
<text x="785.0" y="145.45" text-anchor="middle" font-size="14" fill="#2e2e2b">不會人傳人</text>
<path d="M220,92 L340,92" fill="none" stroke="#3d5a6c" stroke-width="1.4" marker-end="url(#a)"/>
<text x="280" y="84" text-anchor="middle" font-size="13" fill="#3d5a6c">吸血</text>
<path d="M340,118 L220,118" fill="none" stroke="#3d5a6c" stroke-width="1.4" marker-end="url(#a)"/>
<text x="280" y="138" text-anchor="middle" font-size="13" fill="#3d5a6c">叮咬傳染</text>
<path d="M590,100 L700,100" fill="none" stroke="#3d5a6c" stroke-width="1.4" marker-end="url(#a)"/>
<text x="645" y="88" text-anchor="middle" font-size="13" fill="#3d5a6c">蚤糞污染</text>
<text x="645" y="116" text-anchor="middle" font-size="13" fill="#3d5a6c">叮咬傷口</text>
<rect x="340" y="300" width="250" height="70" rx="6" fill="#f3f0e8" fill-opacity="1" stroke="#3d5a6c" stroke-width="1.2"/>
<text x="465.0" y="340.25" text-anchor="middle" font-size="15" fill="#2e2e2b">貓蚤 (Ctenocephalides felis)</text>
<path d="M590,335 L785,335 L785,170" fill="none" stroke="#3d5a6c" stroke-width="1.4" marker-end="url(#a)"/>
<text x="690" y="325" text-anchor="middle" font-size="13" fill="#3d5a6c">叮咬</text>
<rect x="30" y="290" width="230" height="90" rx="6" fill="#ead3cf" fill-opacity="1" stroke="#3d5a6c" stroke-width="1.2"/>
<text x="145.0" y="319.25" text-anchor="middle" font-size="15" fill="#2e2e2b">小袋鼠、貓</text>
<text x="145.0" y="340.25" text-anchor="middle" font-size="12" fill="#2e2e2b">及其他野生或家中動物</text>
<text x="145.0" y="361.25" text-anchor="middle" font-size="12" fill="#2e2e2b">皆可感染</text>
<path d="M260,335 L340,335" fill="none" stroke="#3d5a6c" stroke-width="1.4" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="40" y="460" text-anchor="start" font-size="12" fill="#3d5a6c">依講義 p.198–199 文字整理的示意圖,非原圖</text>
</svg>
