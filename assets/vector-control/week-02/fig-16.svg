<text x="120.0" y="205.6" text-anchor="middle" font-size="16" fill="#2e2e2b">成蟲</text>
<path d="M490,60 Q700,60 700,168" fill="none" stroke="#3d5a6c" stroke-width="1.4" marker-end="url(#a)"/>
